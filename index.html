<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lucky Wheel</title>

    <meta name="description"
        content="A modern customizable Lucky Wheel application for raffles, giveaways, classrooms, games, and decision making.">

    <meta name="keywords"
        content="Lucky Wheel, Wheel Spinner, Random Picker, Giveaway, Decision Maker">

    <meta name="author" content="Seif Basha">

    <link rel="icon" href="assets/icons/favicon.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>

            <h1>🎡 Lucky Wheel</h1>

            <p class="subtitle">
                Randomly choose names, prizes, tasks, teams, or anything you like.
            </p>

        </header>

        <section class="content">

            <!-- Left Panel -->

            <section class="panel">

                <div class="card">

                    <label for="items">
                        Enter Items
                    </label>

                    <textarea
                        id="items"
                        rows="8"
                        placeholder="One item per line

Apple
Banana
Orange
Prize">
                    </textarea>

                </div>

                <div class="card">

                    <label for="duration">
                        Spin Duration (Seconds)
                    </label>

                    <input
                        type="number"
                        id="duration"
                        min="2"
                        max="20"
                        value="5">

                </div>

                <div class="button-group">

                    <button id="spinBtn" class="primary">

                        🎲 Spin

                    </button>

                    <button id="resetBtn">

                        🔄 Reset

                    </button>

                </div>

                <div class="result-card">

                    <h2>Winner</h2>

                    <p id="winner">
                        —
                    </p>

                </div>

                <div class="tips">

                    <h3>Ideas</h3>

                    <ul>

                        <li>🎁 Giveaways</li>

                        <li>📚 Study Groups</li>

                        <li>🎮 Games</li>

                        <li>🍕 Food Choice</li>

                        <li>✅ Daily Tasks</li>

                    </ul>

                </div>

            </section>

            <!-- Right Panel -->

            <section class="panel">

                <div class="wheel-card">

                    <canvas
                        id="wheel"
                        width="600"
                        height="600">

                    </canvas>

                    <div class="pointer">

                    </div>

                </div>

            </section>

        </section>

    </main>

    <footer>

        Built with ❤️ by
        <strong>Seif Basha</strong>

    </footer>

    <script src="script.js"></script>

</body>

</html>
